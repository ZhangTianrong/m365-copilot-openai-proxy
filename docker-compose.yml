services:
  api:
    build: .
    command: ["copilot-openai-proxy", "serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      M365_ACCESS_TOKEN_FILE: /data/access_token.txt
      M365_AUTH_STATE_FILE: /data/auth_session.json
      M365_ACCOUNT_MODE: ${M365_ACCOUNT_MODE:-enterprise}
      M365_TIME_ZONE: ${M365_TIME_ZONE:-Asia/Tokyo}
      M365_MODEL_ALIAS: ${M365_MODEL_ALIAS:-m365-copilot}
      M365_COPILOT_MODEL_NAME: ${M365_COPILOT_MODEL_NAME:-}
      M365_DEBUG_LOGGING: ${M365_DEBUG_LOGGING:-false}
      M365_ENABLE_CONVERSATION_REUSE: ${M365_ENABLE_CONVERSATION_REUSE:-false}
      M365_CONVERSATION_DB_PATH: ${M365_CONVERSATION_DB_PATH:-/data/conversation_reuse.db}
      M365_CONVERSATION_MAX_CONVERSATIONS: ${M365_CONVERSATION_MAX_CONVERSATIONS:-500}
    volumes:
      - ./state:/data
    depends_on:
      - token-refresher

  token-refresher:
    build: .
    command: ["copilot-openai-proxy", "refresh-daemon"]
    environment:
      M365_ACCESS_TOKEN_FILE: /data/access_token.txt
      M365_AUTH_STATE_FILE: /data/auth_session.json
      M365_ACCOUNT_MODE: ${M365_ACCOUNT_MODE:-enterprise}
      M365_PROFILE_DIR: /data/profile
      M365_LOGIN_URL: ${M365_LOGIN_URL:-https://m365.cloud.microsoft/chat}
      M365_LOGIN_EMAIL: ${M365_LOGIN_EMAIL:-}
      M365_LOGIN_PASSWORD: ${M365_LOGIN_PASSWORD:-}
      M365_LOGIN_TOTP_SECRET: ${M365_LOGIN_TOTP_SECRET:-}
      M365_DEBUG_LOGGING: ${M365_DEBUG_LOGGING:-false}
      M365_AUTO_PROBE_MODELS_ON_LOGIN: ${M365_AUTO_PROBE_MODELS_ON_LOGIN:-true}
      M365_TOKEN_CAPTURE_TIMEOUT_SECONDS: ${M365_TOKEN_CAPTURE_TIMEOUT_SECONDS:-600}
      M365_TOKEN_REFRESH_BUFFER_SECONDS: ${M365_TOKEN_REFRESH_BUFFER_SECONDS:-300}
      M365_TOKEN_REFRESH_RETRY_SECONDS: ${M365_TOKEN_REFRESH_RETRY_SECONDS:-30}
    shm_size: 1gb
    volumes:
      - ./state:/data
